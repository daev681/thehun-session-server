version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: session_server
      POSTGRES_USER: thehun
      POSTGRES_PASSWORD: thehun_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thehun -d session_server"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
